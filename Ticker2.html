<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投資級債券清單 | IG Bond Monitor</title>
<style>
:root{
  --bg:#0b0f14;
  --panel:#111823;
  --panel2:#0e141d;
  --line:#1f2b3a;
  --line-soft:#182230;
  --text:#dbe6f0;
  --text-dim:#7f93a8;
  --text-faint:#546475;
  --accent:#3ddc97;
  --accent-dim:#2a9d70;
  --red:#ff6b6b;
  --amber:#f2b84b;
  --mono: "IBM Plex Mono","SF Mono",Consolas,monospace;
  --sans: "IBM Plex Sans","Segoe UI",-apple-system,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
::selection{background:var(--accent-dim);color:#00140b;}

/* ---------- Header ---------- */
.topbar{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(180deg,#0d131b 0%, #0b0f14 100%);
  border-bottom:1px solid var(--line);
  padding:14px 24px;
}
.topbar-inner{max-width:1400px;margin:0 auto;display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.brand{display:flex;align-items:baseline;gap:10px;}
.brand .mark{
  font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:2px;
  color:#00140b;background:var(--accent);padding:3px 7px;border-radius:3px;
}
.brand h1{font-size:16px;font-weight:600;margin:0;letter-spacing:0.3px;color:var(--text);}
.brand .sub{font-family:var(--mono);font-size:11px;color:var(--text-faint);}
.asof{font-family:var(--mono);font-size:12px;color:var(--text-dim);text-align:right;}
.asof b{color:var(--accent);font-weight:600;}

/* ---------- Tabs ---------- */
.tabs{
  max-width:1400px;margin:0 auto;padding:0 24px;
  display:flex;gap:2px;border-bottom:1px solid var(--line);
  background:var(--bg);
}
.tab{
  font-family:var(--mono);font-size:12.5px;letter-spacing:0.5px;
  padding:12px 18px;cursor:pointer;color:var(--text-dim);
  border-bottom:2px solid transparent;user-select:none;
  transition:color .15s;
}
.tab:hover{color:var(--text);}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.tab .count{color:var(--text-faint);margin-left:6px;font-size:11px;}
.tab.active .count{color:var(--accent-dim);}

/* ---------- Controls ---------- */
.controls{
  max-width:1400px;margin:0 auto;padding:16px 24px 8px;
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;
}
.search-wrap{position:relative;flex:1;min-width:220px;max-width:360px;}
.search-wrap input{
  width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);
  font-family:var(--sans);font-size:13px;padding:9px 12px 9px 32px;border-radius:6px;
  outline:none;transition:border-color .15s;
}
.search-wrap input:focus{border-color:var(--accent-dim);}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.5;}
.search-wrap input::placeholder{color:var(--text-faint);}

.chip-group{display:flex;gap:6px;flex-wrap:wrap;}
.chip{
  font-family:var(--mono);font-size:11px;padding:6px 11px;border-radius:20px;
  border:1px solid var(--line);color:var(--text-dim);cursor:pointer;background:var(--panel);
  transition:all .15s;user-select:none;
}
.chip:hover{border-color:var(--text-dim);color:var(--text);}
.chip.active{background:var(--accent-dim);border-color:var(--accent-dim);color:#00140b;font-weight:600;}

.meta-line{
  max-width:1400px;margin:0 auto;padding:0 24px 10px;
  font-family:var(--mono);font-size:11px;color:var(--text-faint);
  display:flex;justify-content:space-between;
}
.meta-line span b{color:var(--text-dim);}

/* ---------- Table ---------- */
.table-wrap{max-width:1400px;margin:0 auto;padding:0 24px 40px;overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:1100px;}
thead th{
  position:static;background:var(--panel2);
  text-align:left;padding:9px 10px;font-weight:600;font-size:11px;
  color:var(--text-dim);border-bottom:1px solid var(--line);
  cursor:pointer;white-space:nowrap;letter-spacing:0.3px;
  user-select:none;
}
thead th:hover{color:var(--text);}
thead th .arrow{font-size:9px;margin-left:3px;color:var(--accent);}
thead th.num, td.num{text-align:right;}
tbody td{
  padding:8px 10px;border-bottom:1px solid var(--line-soft);white-space:nowrap;
  font-family:var(--sans);
}
tbody tr{transition:background .1s;}
tbody tr:hover{background:#131d29;}
td.num, td.mono{font-family:var(--mono);}
td.issuer-cn{color:var(--text);font-weight:500;}
td.issuer-en{color:var(--text-dim);font-size:11.5px;}
td.ticker{font-family:var(--mono);color:var(--accent);font-weight:600;font-size:12px;}
td.isin{font-family:var(--mono);color:var(--text-faint);font-size:11px;letter-spacing:0.3px;}
td.rating{font-family:var(--mono);font-size:11px;color:var(--text-dim);}
.rank-badge{
  font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:3px;
  border:1px solid var(--line);color:var(--text-dim);white-space:nowrap;
}
.rank-badge.tlac{border-color:#3d5ddc55;color:#7d9bff;}
.rank-badge.tier2{border-color:#f2b84b55;color:var(--amber);}
.pos{color:var(--accent);}
.neg{color:var(--red);}
.dim{color:var(--text-faint);}
td.currency{font-family:var(--mono);font-size:11px;color:var(--text-faint);}

.empty-state{
  max-width:1400px;margin:60px auto;text-align:center;color:var(--text-faint);
  font-family:var(--mono);font-size:13px;
}

footer{
  max-width:1400px;margin:0 auto;padding:20px 24px 40px;
  font-family:var(--mono);font-size:10.5px;color:var(--text-faint);
  border-top:1px solid var(--line-soft);
}

@media (max-width:700px){
  .topbar{padding:12px 16px;}
  .controls,.meta-line,.table-wrap,.tabs,footer{padding-left:16px;padding-right:16px;}
  thead th{top:88px;}
}
</style>
</head>

<script>
const SCHEMAS = {
  short: {
    label: '短年期 IG 債券',
    cols: [
      {k:'issuer_cn', h:'發行人', type:'issuer'},
      {k:'issuer_en', h:'', type:'issuer_en', hideHeader:true},
      {k:'ticker', h:'代碼', type:'ticker'},
      {k:'isin', h:'ISIN', type:'isin'},
      {k:'rating', h:"Moody's/S&P/Fitch", type:'rating'},
      {k:'coupon', h:'票息%', type:'num'},
      {k:'call', h:'贖回日', type:'date'},
      {k:'maturity', h:'到期日', type:'date'},
      {k:'offer', h:'Offer%', type:'num'},
      {k:'ytc', h:'YTC%', type:'num'},
      {k:'ytm', h:'YTM%', type:'num'},
      {k:'rank', h:'順位', type:'rank'},
      {k:'d5', h:'5D%', type:'signed'},
      {k:'ytd', h:'YTD%', type:'signed'},
    ]
  },
  long: {
    label: '長年期 IG 債券',
    cols: [
      {k:'issuer_cn', h:'發行人', type:'issuer'},
      {k:'issuer_en', h:'', type:'issuer_en', hideHeader:true},
      {k:'ticker', h:'代碼', type:'ticker'},
      {k:'isin', h:'ISIN', type:'isin'},
      {k:'rating', h:"Moody's/S&P/Fitch", type:'rating'},
      {k:'coupon', h:'票息%', type:'num'},
      {k:'maturity', h:'到期日', type:'date'},
      {k:'call', h:'贖回日', type:'date'},
      {k:'offer', h:'Offer%', type:'num'},
      {k:'ytc', h:'YTC%', type:'num'},
      {k:'ytm', h:'YTM%', type:'num'},
      {k:'rank', h:'順位', type:'rank'},
      {k:'d5', h:'5D%', type:'signed'},
      {k:'ytd', h:'YTD%', type:'signed'},
      {k:'duration', h:'存續期', type:'num'},
    ]
  },
  fin: {
    label: '金融債券',
    cols: [
      {k:'issuer_cn', h:'發行人', type:'issuer'},
      {k:'issuer_en', h:'', type:'issuer_en', hideHeader:true},
      {k:'ticker', h:'代碼', type:'ticker'},
      {k:'isin', h:'ISIN', type:'isin'},
      {k:'rating', h:"Moody's/S&P/Fitch", type:'rating'},
      {k:'coupon', h:'票息%', type:'num'},
      {k:'reset', h:'Coupon Reset', type:'text'},
      {k:'maturity', h:'到期日', type:'date'},
      {k:'call', h:'贖回日', type:'date'},
      {k:'offer', h:'Offer%', type:'num'},
      {k:'ytc', h:'YTC%', type:'num'},
      {k:'ytm', h:'YTM%', type:'num'},
      {k:'rank', h:'順位', type:'rank'},
      {k:'d5', h:'5D%', type:'signed'},
      {k:'ytd', h:'YTD%', type:'signed'},
      {k:'currency', h:'幣別', type:'currency'},
    ]
  }
};

// map raw arrays -> row objects per tab
function mapRow(tab, arr){
  if(tab === 'short'){
    return {issuer_cn:arr[0],issuer_en:arr[1],ticker:arr[2],isin:arr[3],rating:arr[4],coupon:arr[5],call:arr[6],maturity:arr[7],offer:arr[8],ytc:arr[9],ytm:arr[10],rank:arr[11],d5:arr[12],ytd:arr[13]};
  }
  if(tab === 'long'){
    return {issuer_cn:arr[0],issuer_en:arr[1],ticker:arr[2],isin:arr[3],rating:arr[4],coupon:arr[5],maturity:arr[6],call:arr[7],offer:arr[8],ytc:arr[9],ytm:arr[10],rank:arr[11],d5:arr[12],ytd:arr[13],duration:arr[14]};
  }
  if(tab === 'fin'){
    return {issuer_cn:arr[0],issuer_en:arr[1],ticker:arr[2],isin:arr[3],rating:arr[4],coupon:arr[5],reset:arr[6],maturity:arr[7],call:arr[8],offer:arr[9],ytc:arr[10],ytm:arr[11],rank:arr[12],d5:arr[13],ytd:arr[14],currency:arr[15]};
  }
}

const ROWS = {
  short: DATA.short.map(r => mapRow('short', r)),
  long: DATA.long.map(r => mapRow('long', r)),
  fin: DATA.fin.map(r => mapRow('fin', r)),
};

let state = { tab:'short', sortKey:null, sortDir:1, query:'', rankFilter:null };

function fmtNum(v, decimals=2){
  if(v===null||v===undefined||v==='-') return '<span class="dim">–</span>';
  return Number(v).toFixed(decimals);
}
function fmtSigned(v){
  if(v===null||v===undefined) return '<span class="dim">–</span>';
  const n = Number(v);
  const cls = n>0 ? 'pos' : (n<0 ? 'neg' : 'dim');
  const sign = n>0 ? '+' : '';
  return `<span class="${cls}">${sign}${n.toFixed(3)}</span>`;
}
function fmtRank(v){
  if(!v) return '<span class="dim">–</span>';
  const cls = v.toLowerCase().includes('tier2') ? 'tier2' : (v.toLowerCase().includes('tlac') ? 'tlac' : '');
  return `<span class="rank-badge ${cls}">${v}</span>`;
}

function renderHead(){
  const schema = SCHEMAS[state.tab];
  const thead = document.getElementById('tableHead');
  let html = '<tr>';
  schema.cols.forEach(c=>{
    if(c.hideHeader){ html += `<th style="min-width:150px;">${c.h}</th>`; return; }
    const numLike = ['num','signed'].includes(c.type);
    let arrow = '';
    if(state.sortKey === c.k){
      arrow = `<span class="arrow">${state.sortDir===1?'▲':'▼'}</span>`;
    }
    html += `<th data-key="${c.k}" class="${numLike?'num':''}">${c.h}${arrow}</th>`;
  });
  html += '</tr>';
  thead.innerHTML = html;
  thead.querySelectorAll('th[data-key]').forEach(th=>{
    th.addEventListener('click', ()=>{
      const key = th.getAttribute('data-key');
      if(state.sortKey === key){ state.sortDir *= -1; }
      else { state.sortKey = key; state.sortDir = 1; }
      render();
    });
  });
}

function getFiltered(){
  const schema = SCHEMAS[state.tab];
  let rows = ROWS[state.tab].slice();
  if(state.query){
    const q = state.query.toLowerCase();
    rows = rows.filter(r =>
      (r.issuer_cn||'').toLowerCase().includes(q) ||
      (r.issuer_en||'').toLowerCase().includes(q) ||
      (r.ticker||'').toLowerCase().includes(q) ||
      (r.isin||'').toLowerCase().includes(q) ||
      (r.rating||'').toLowerCase().includes(q)
    );
  }
  if(state.rankFilter){
    rows = rows.filter(r => (r.rank||'').toLowerCase().includes(state.rankFilter.toLowerCase()));
  }
  if(state.sortKey){
    rows.sort((a,b)=>{
      let av = a[state.sortKey], bv = b[state.sortKey];
      const col = schema.cols.find(c=>c.k===state.sortKey);
      const isNum = col && (col.type==='num'||col.type==='signed');
      if(isNum){
        av = (av===null||av===undefined||av==='-') ? -Infinity : Number(av);
        bv = (bv===null||bv===undefined||bv==='-') ? -Infinity : Number(bv);
        return (av-bv) * state.sortDir;
      } else {
        av = (av||'').toString(); bv = (bv||'').toString();
        return av.localeCompare(bv) * state.sortDir;
      }
    });
  }
  return rows;
}

function renderBody(){
  const schema = SCHEMAS[state.tab];
  const rows = getFiltered();
  const tbody = document.getElementById('tableBody');
  const empty = document.getElementById('emptyState');
  document.getElementById('rowCount').textContent = rows.length;
  document.getElementById('totalCount').textContent = ROWS[state.tab].length;

  if(rows.length === 0){
    tbody.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  let html = '';
  rows.forEach(r=>{
    html += '<tr>';
    schema.cols.forEach(c=>{
      const v = r[c.k];
      switch(c.type){
        case 'issuer': html += `<td class="issuer-cn">${v}</td>`; break;
        case 'issuer_en': html += `<td class="issuer-en">${v}</td>`; break;
        case 'ticker': html += `<td class="ticker">${v}</td>`; break;
        case 'isin': html += `<td class="isin">${v}</td>`; break;
        case 'rating': html += `<td class="rating">${v}</td>`; break;
        case 'num': html += `<td class="num mono">${fmtNum(v, c.k==='duration'?2:3)}</td>`; break;
        case 'signed': html += `<td class="num mono">${fmtSigned(v)}</td>`; break;
        case 'date': html += `<td class="mono ${v==='-'?'dim':''}">${v==='-'? '–' : v}</td>`; break;
        case 'rank': html += `<td>${fmtRank(v)}</td>`; break;
        case 'text': html += `<td class="mono dim">${v && v!=='-' ? v : '–'}</td>`; break;
        case 'currency': html += `<td class="currency">${v}</td>`; break;
        default: html += `<td>${v}</td>`;
      }
    });
    html += '</tr>';
  });
  tbody.innerHTML = html;
}

function renderRankChips(){
  const wrap = document.getElementById('rankChips');
  const ranks = Array.from(new Set(ROWS[state.tab].map(r=>r.rank).filter(Boolean)));
  let html = `<div class="chip ${!state.rankFilter?'active':''}" data-rank="">全部順位</div>`;
  ranks.forEach(r=>{
    html += `<div class="chip ${state.rankFilter===r?'active':''}" data-rank="${r}">${r}</div>`;
  });
  wrap.innerHTML = html;
  wrap.querySelectorAll('.chip').forEach(ch=>{
    ch.addEventListener('click', ()=>{
      state.rankFilter = ch.getAttribute('data-rank') || null;
      render();
    });
  });
}

function updateTabCounts(){
  document.querySelectorAll('.tab').forEach(t=>{
    const tab = t.getAttribute('data-tab');
    t.querySelector('.count').textContent = `(${ROWS[tab].length})`;
  });
}

function render(){
  renderHead();
  renderRankChips();
  renderBody();
}

document.getElementById('tabs').addEventListener('click', (e)=>{
  const tabEl = e.target.closest('.tab');
  if(!tabEl) return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  tabEl.classList.add('active');
  state.tab = tabEl.getAttribute('data-tab');
  state.sortKey = null; state.sortDir = 1; state.rankFilter = null;
  document.getElementById('searchInput').value = '';
  state.query = '';
  render();
});

document.getElementById('searchInput').addEventListener('input', (e)=>{
  state.query = e.target.value;
  render();
});

updateTabCounts();
render();
</script>
